[package]
name = "quire-forms"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Fill AcroForm fields in existing PDFs (workspace shell; API not started)"
license.workspace = true
publish.workspace = true
keywords = ["pdf", "acroform", "forms"]
categories = ["graphics"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
