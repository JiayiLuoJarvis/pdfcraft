[package]
name = "pdfcraft-forms"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Fill AcroForm fields in an existing PDF and flatten the result"
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/pdfcraft-forms"
keywords = ["pdf", "acroform", "forms"]
categories = ["graphics"]
include = [
    "src/**/*",
    "examples/**/*",
    "docs/**/*",
    "tests/fixtures/README.md",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
lopdf = { workspace = true }
skrifa = { workspace = true, features = ["std", "autohint_shaping"] }

[lints]
workspace = true
