name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: clippy (backend-krilla)
        run: cargo clippy --all-targets --features backend-krilla -- -D warnings

      - name: test (no default features)
        run: cargo test --no-default-features

      - name: test (backend-krilla)
        run: cargo test --features backend-krilla

      - name: doc (no default features)
        run: cargo doc --no-deps --no-default-features

      - name: doc (backend-krilla)
        run: cargo doc --no-deps --features backend-krilla
