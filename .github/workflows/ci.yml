name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  basics:
    name: basics (fmt / module-dag / clippy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7

      - name: module dag
        run: python3 scripts/check_pdfcraft_pdf_modules.py

      # v1 of dtolnay/rust-toolchain points at this commit as of 2026-10-09.
      # Later moves of that tag do not change this pin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.92"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: readme identity
        run: python3 scripts/check_readme_identity.py

      - name: clippy forms, orgchart, and post
        run: cargo clippy -p pdfcraft-forms -p pdfcraft-orgchart -p pdfcraft-post --all-targets -- -D warnings

      - name: clippy pdfcraft-pdf (no default features)
        run: cargo clippy -p pdfcraft-pdf --all-targets --no-default-features --features test-utils -- -D warnings

      - name: clippy pdfcraft-pdf (backend-krilla)
        run: cargo clippy -p pdfcraft-pdf --all-targets --features backend-krilla,test-utils -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    needs: basics
    steps:
      - uses: actions/checkout@v7

      # v1 of dtolnay/rust-toolchain points at this commit as of 2026-10-09.
      # Later moves of that tag do not change this pin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.92"

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "cargo-deny install expects x86_64." >&2
            exit 1
          fi
          version="0.20.2"
          asset="cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/${asset}"
          # Hash of the upstream x86_64 musl tarball for 0.20.2.
          expected="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          curl -fsSL -o "${RUNNER_TEMP}/${asset}" "${url}"
          echo "${expected}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}"
          bin_dir="${RUNNER_TEMP}/cargo-deny-${version}-x86_64-unknown-linux-musl"
          chmod +x "${bin_dir}/cargo-deny"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: cargo-deny
        run: |
          cargo deny --version
          cargo deny check advisories licenses bans sources

  test:
    name: test / doc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: basics
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # v1 of dtolnay/rust-toolchain points at this commit as of 2026-10-09.
      # Later moves of that tag do not change this pin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.92"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install poppler
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y poppler-utils fonts-dejavu-core fonts-noto-cjk
              ;;
            macOS)
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install poppler
              ;;
            *)
              echo "No poppler install for ${RUNNER_OS}." >&2
              exit 1
              ;;
          esac
          command -v pdftotext
          command -v pdfinfo

      - name: Resolve test fonts
        run: |
          set -euo pipefail
          mkdir -p .ci-fonts
          case "${RUNNER_OS}" in
            Linux)
              forms=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
              cjk="$(find /usr/share/fonts -type f \( -name 'NotoSansCJK*Regular*.ttc' -o -name 'NotoSansCJKsc-Regular.otf' \) | head -n1)"
              ;;
            macOS)
              curl -fsSL -o .ci-fonts/DejaVuSans.ttf \
                "https://github.com/dejavu-fonts/dejavu-fonts/raw/version_2_37/ttf/DejaVuSans.ttf"
              forms="$PWD/.ci-fonts/DejaVuSans.ttf"
              cjk=""
              ;;
            *)
              echo "No font setup for ${RUNNER_OS}." >&2
              exit 1
              ;;
          esac
          test -f "$forms"
          {
            echo "PDFCRAFT_FORMS_FONT=${forms}"
            echo "PDFCRAFT_PDF_FONT=${forms}"
            if [ -n "${cjk}" ] && [ -f "${cjk}" ]; then
              echo "PDFCRAFT_CJK_FONT=${cjk}"
              echo "PDFCRAFT_PDF_FONT=${cjk}"
            fi
          } >> "${GITHUB_ENV}"

      # Unit + integration tests run under nextest. Doctests are not
      # runnable by nextest, so each suite below has a matching
      # `cargo test --doc` step further down.
      - name: test pdfcraft-forms
        run: cargo nextest run -p pdfcraft-forms

      - name: test pdfcraft-post
        run: cargo nextest run -p pdfcraft-post

      - name: test pdfcraft-orgchart
        run: cargo nextest run -p pdfcraft-orgchart

      - name: test pdfcraft-pdf (no default features)
        run: cargo nextest run -p pdfcraft-pdf --no-default-features --features test-utils

      - name: test pdfcraft-pdf (backend-krilla)
        run: cargo nextest run -p pdfcraft-pdf --features backend-krilla,test-utils

      - name: doc-test pdfcraft-forms
        run: cargo test --doc -p pdfcraft-forms

      - name: doc-test pdfcraft-post
        run: cargo test --doc -p pdfcraft-post

      - name: doc-test pdfcraft-orgchart
        run: cargo test --doc -p pdfcraft-orgchart

      - name: doc-test pdfcraft-pdf (no default features)
        run: cargo test --doc -p pdfcraft-pdf --no-default-features --features test-utils

      - name: doc-test pdfcraft-pdf (backend-krilla)
        run: cargo test --doc -p pdfcraft-pdf --features backend-krilla,test-utils

      - name: doc pdfcraft-pdf (no default features)
        run: cargo doc -p pdfcraft-pdf --no-deps --no-default-features

      - name: doc pdfcraft-pdf (backend-krilla)
        run: cargo doc -p pdfcraft-pdf --no-deps --features backend-krilla

      - name: doc shells
        run: cargo doc -p pdfcraft-forms -p pdfcraft-orgchart -p pdfcraft-post --no-deps

  minrust:
    name: minrust (1.92 cargo check)
    runs-on: ubuntu-latest
    needs: basics
    steps:
      - uses: actions/checkout@v7

      # v1 of dtolnay/rust-toolchain points at this commit as of 2026-10-09.
      # Later moves of that tag do not change this pin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.92"

      - uses: Swatinem/rust-cache@v2

      # Pinned floor: the workspace must check on exactly rust-version 1.92
      # with the committed lockfile.
      - name: minrust check
        run: cargo check --workspace --locked

  minimal-versions:
    name: minimal-versions (nightly)
    runs-on: ubuntu-latest
    needs: basics
    # Nightly-only and slow: keep the PR path fast, run on main + manual.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      # v1 of dtolnay/rust-toolchain points at this commit as of 2026-10-09.
      # Later moves of that tag do not change this pin.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2

      # Resolve the lowest versions Cargo allows, then check the workspace
      # against that floor. The lockfile rewrite stays on the runner.
      - name: minimal-versions check
        run: |
          set -euo pipefail
          cargo update -Z minimal-versions
          cargo check --workspace -Z minimal-versions

  semver-checks:
    name: semver-checks
    runs-on: ubuntu-latest
    needs: basics
    steps:
      - uses: actions/checkout@v7

      # pdfcraft-pdf has explicit features; check them exactly instead of
      # the heuristic set, so feature-gated public API is covered.
      - name: semver pdfcraft-pdf (explicit features)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: pdfcraft-pdf
          feature-group: only-explicit-features
          features: backend-krilla,test-utils

      # The remaining workspace crates take the default feature heuristic.
      - name: semver rest of workspace
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          exclude: pdfcraft-pdf

  feature-matrix:
    name: feature matrix (cargo hack)
    runs-on: ubuntu-latest
    needs: basics
    steps:
      - uses: actions/checkout@v7

      # v1 of dtolnay/rust-toolchain points at this commit as of 2026-10-09.
      # Later moves of that tag do not change this pin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.92"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: feature matrix
        run: cargo hack check --each-feature -p pdfcraft-pdf
