[package]
name = "pdfcraft-post"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Post-process existing PDF bytes: metadata, encrypt, merge, and pipelines"
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/pdfcraft-post"
keywords = ["pdf", "encrypt", "metadata", "merge"]
categories = ["graphics"]
include = [
    "src/**/*",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
getrandom = { workspace = true }
lopdf = { workspace = true }

[dev-dependencies]
lopdf = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
