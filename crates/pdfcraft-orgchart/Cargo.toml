[package]
name = "pdfcraft-orgchart"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Equity and outbound-investment charts. Callers pass FontBytes. Measurement uses skrifa; drawing uses krilla."
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/pdfcraft-orgchart"
keywords = ["pdf", "org-chart", "ownership"]
categories = ["graphics"]
include = [
    "src/**/*",
    "examples/**/*",
    "docs/**/*",
    "tests/fixtures/fonts/OFL.txt",
    "tests/fixtures/fonts/PROVENANCE.txt",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
read-fonts = { workspace = true, features = ["std"] }
skrifa = { workspace = true, default-features = false, features = ["std"] }
krilla = { workspace = true }

[dev-dependencies]
lopdf = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
allow_attributes_without_reason = "warn"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
