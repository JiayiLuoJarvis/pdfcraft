name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1 of dtolnay/rust-toolchain points at this commit as of 2026-10-09.
      # Later moves of that tag do not change this pin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.92"

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "cargo-deny install expects x86_64." >&2
            exit 1
          fi
          version="0.20.2"
          asset="cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/${asset}"
          # Hash of the upstream x86_64 musl tarball for 0.20.2.
          expected="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          curl -fsSL -o "${RUNNER_TEMP}/${asset}" "${url}"
          echo "${expected}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}"
          bin_dir="${RUNNER_TEMP}/cargo-deny-${version}-x86_64-unknown-linux-musl"
          chmod +x "${bin_dir}/cargo-deny"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: cargo-deny
        run: |
          cargo deny --version
          cargo deny check advisories licenses

  check:
    name: fmt / clippy / test / doc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: module dag
        run: python3 scripts/check_quire_pdf_modules.py

      # v1 of dtolnay/rust-toolchain points at this commit as of 2026-10-09.
      # Later moves of that tag do not change this pin.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.92"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: Install poppler
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y poppler-utils
              ;;
            macOS)
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install poppler
              ;;
            *)
              echo "No poppler install for ${RUNNER_OS}." >&2
              exit 1
              ;;
          esac
          command -v pdftotext
          command -v pdfinfo

      - name: clippy forms and orgchart
        run: cargo clippy -p quire-forms -p quire-orgchart --all-targets -- -D warnings

      - name: test quire-forms
        run: cargo test -p quire-forms

      - name: clippy quire-pdf (no default features)
        run: cargo clippy -p quire-pdf --all-targets --no-default-features --features test-utils -- -D warnings

      - name: clippy quire-pdf (backend-krilla)
        run: cargo clippy -p quire-pdf --all-targets --features backend-krilla,test-utils -- -D warnings

      - name: test quire-orgchart
        run: cargo test -p quire-orgchart

      - name: test quire-pdf (no default features)
        run: cargo test -p quire-pdf --no-default-features --features test-utils

      - name: test quire-pdf (backend-krilla)
        run: cargo test -p quire-pdf --features backend-krilla,test-utils

      - name: doc quire-pdf (no default features)
        run: cargo doc -p quire-pdf --no-deps --no-default-features

      - name: doc quire-pdf (backend-krilla)
        run: cargo doc -p quire-pdf --no-deps --features backend-krilla

      - name: doc shells
        run: cargo doc -p quire-forms -p quire-orgchart --no-deps
