[package]
name = "quire-pdf"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Lay out DocumentSpec values (flow, bands, layers) and emit vector PDF via a sealed krilla backend"
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/quire-pdf"
keywords = ["pdf", "layout", "typography", "document"]
categories = ["graphics", "text-processing"]
publish.workspace = true
include = [
    "src/**/*",
    "examples/**/*",
    "docs/**/*",
    "tests/fixtures/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["backend-krilla"]
backend-krilla = ["dep:krilla", "dep:png"]
# Floating-point helpers for integration tests (`pt_near`, `PT_ABS_TOLERANCE`).
test-utils = []

[dependencies]
krilla = { version = "=0.8.2", optional = true, default-features = false, features = ["raster-images"] }
png = { version = "=0.18.1", optional = true }
skrifa = { version = "=0.48.0" }
unicode-segmentation = { version = "=1.13.3" }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[example]]
name = "hello"
required-features = ["backend-krilla"]

[[example]]
name = "bill"
required-features = ["backend-krilla"]
