[package]
name = "pdfcraft-forms"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Fill AcroForm fields in an existing PDF and flatten the result"
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/pdfcraft-forms"
keywords = ["pdf", "acroform", "forms"]
categories = ["graphics"]
include = [
    "src/**/*",
    "examples/**/*",
    "docs/**/*",
    "tests/fixtures/README.md",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
lopdf = { workspace = true }
skrifa = { workspace = true, features = ["std", "autohint_shaping"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
